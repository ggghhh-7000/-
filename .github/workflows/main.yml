name: Weekend Email Notifier (Outlook)

on:
  push:
    branches: [ "**" ]
  issues:
    types: [ opened, reopened ]
  pull_request:
    types: [ opened, reopened, synchronize ]
  deployment:
    types: [ created ]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
    - name: Check Day of Week (Friday or Saturday)
      id: check-day
      run: |
        DAY_OF_WEEK=$(TZ='Asia/Taipei' date +%u)
        echo "Current day (1-7): $DAY_OF_WEEK"
        
        # 5 是星期五，6 是星期六
        if [ "$DAY_OF_WEEK" -eq 5 ] || [ "$DAY_OF_WEEK" -eq 6 ]; then
          echo "is_weekend_target=true" >> $GITHUB_OUTPUT
        else
          echo "is_weekend_target=false" >> $GITHUB_OUTPUT
        fi

    - name: Send Email via Outlook
      if: steps.check-day.outputs.is_weekend_target == 'true'
      env:
        OUTLOOK_USER: ${{ secrets.OUTLOOK_USER }}
        OUTLOOK_PASS: ${{ secrets.OUTLOOK_PASS }}
        TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        python3 -c '
        import os
        import json
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart

        raw_context = os.environ.get("GITHUB_CONTEXT", "{}")
        if isinstance(raw_context, str):
            try:
                github_data = json.loads(raw_context)
            except:
                github_data = {}
        else:
            github_data = raw_context

        if not isinstance(github_data, dict):
            github_data = {}

        event_name = os.environ.get("GITHUB_EVENT_NAME", "")
        repo = github_data.get("repository", {})
        if isinstance(repo, dict):
            repo_name = repo.get("full_name", "Unknown Repo")
        else:
            repo_name = "Unknown Repo"
        
        # 判斷觸發事件並抓取對應網址
        url = "https://github.com/" + repo_name
        action_desc = "有新的動作"

        event_data = github_data.get("event", {})
        if not isinstance(event_data, dict):
            event_data = {}

        if event_name == "push":
            action_desc = "新增了 Commit / 程式碼 / 檔案"
            url = event_data.get("compare", url)
        elif event_name == "issues":
            action_desc = "建立了新的問題 (Issue)"
            issue_info = event_data.get("issue", {})
            if isinstance(issue_info, dict):
                url = issue_info.get("html_url", url)
        elif event_name == "pull_request":
            action_desc = "申請了新的 Pull Request (PR)"
            pr_info = event_data.get("pull_request", {})
            if isinstance(pr_info, dict):
                url = pr_info.get("html_url", url)
        elif event_name == "deployment":
            action_desc = "有新的部署頁面事件"

        # 郵件內容
        sender = os.environ["OUTLOOK_USER"]
        receiver = os.environ["TARGET_EMAIL"]
        
        msg = MIMEMultipart("alternative")
        msg["Subject"] = f"[GitHub 通知] {repo_name} 有新的活動"
        msg["From"] = sender
        msg["To"] = receiver

        html_content = f"""
        <h3>GitHub 儲存庫通知</h3>
        <p><b>儲存庫：</b> {repo_name}</p>
        <p><b>事件類型：</b> {action_desc}</p>
        <p><b>相關網址：</b> <a href="{url}">{url}</a></p>
        """
        msg.attach(MIMEText(html_content, "html"))

        # 透過 Outlook SMTP 發送
        try:
            with smtplib.SMTP_SSL("smtp-mail.outlook.com", 465) as server:
                server.login(sender, os.environ["OUTLOOK_PASS"])
                server.sendmail(sender, receiver, msg.as_string())
            print("Email sent successfully via Outlook!")
        except Exception as e:
            print("Failed to send email:", e)
        '
