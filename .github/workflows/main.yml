name: Weekend Email Notifier (Outlook)

on:
  push:
    branches: [ "**" ]
  issues:
    types: [ opened, reopened ]
  pull_request:
    types: [ opened, reopened, synchronize ]
  deployment:
    types: [ created ]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
    - name: Check Day of Week (Friday or Saturday)
      id: check-day
      run: |
        DAY_OF_WEEK=$(TZ='Asia/Taipei' date +%u)
        echo "Current day (1-7): $DAY_OF_WEEK"
        
        # 5 是星期五，6 是星期六
        if [ "$DAY_OF_WEEK" -eq 5 ] || [ "$DAY_OF_WEEK" -eq 6 ]; then
          echo "is_weekend_target=true" >> $GITHUB_OUTPUT
        else
          echo "is_weekend_target=false" >> $GITHUB_OUTPUT
        fi

    - name: Send Email via Outlook
      if: steps.check-day.outputs.is_weekend_target == 'true'
      env:
        OUTLOOK_USER: ${{ secrets.ggghhh157@outlook.com⁠ }}
        OUTLOOK_PASS: ${{ secrets.ozbvkoizjfpalyrm }}
        TARGET_EMAIL: ${{ secrets.minchenou88@gmail.com }}
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        python3 -c '
        import os
        import json
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart

        github_data = json.loads(os.environ["GITHUB_CONTEXT"])
        event_name = os.environ.get("GITHUB_EVENT_NAME")
        repo = github_data.get("repository", {}).get("full_name", "Unknown Repo")
        
        # 判斷觸發事件並抓取對應網址
        url = "https://github.com/" + repo
        action_desc = "有新的動作"

        if event_name == "push":
            action_desc = "新增了 Commit / 程式碼 / 檔案"
            url = github_data.get("event", {}).get("compare", url)
        elif event_name == "issues":
            action_desc = "建立了新的問題 (Issue)"
            url = github_data.get("event", {}).get("issue", {}).get("html_url", url)
        elif event_name == "pull_request":
            action_desc = "申請了新的 Pull Request (PR)"
            url = github_data.get("event", {}).get("pull_request", {}).get("html_url", url)
        elif event_name == "deployment":
            action_desc = "有新的部署頁面事件"

        # 郵件內容
        sender = os.environ["OUTLOOK_USER"]
        receiver = os.environ["TARGET_EMAIL"]
        
        msg = MIMEMultipart("alternative")
        msg["Subject"] = f"[GitHub 通知] {repo} 有新的活動"
        msg["From"] = sender
        msg["To"] = receiver

        html_content = f"""
        <h3>GitHub 儲存庫通知</h3>
        <p><b>儲存庫：</b> {repo}</p>
        <p><b>事件類型：</b> {action_desc}</p>
        <p><b>相關網址：</b> <a href="{url}">{url}</a></p>
        """
        msg.attach(MIMEText(html_content, "html"))

        # 透過 Outlook SMTP 發送
        try:
            with smtplib.SMTP_SSL("smtp-mail.outlook.com", 465) as server:
                server.login(sender, os.environ["OUTLOOK_PASS"])
                server.sendmail(sender, receiver, msg.as_string())
            print("Email sent successfully via Outlook!")
        except Exception as e:
            print("Failed to send email:", e)
        '
