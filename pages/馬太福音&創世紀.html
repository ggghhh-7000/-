<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字展示</title>
    <style>
        /* 全局重置與背景漸層 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            /* 藍色漸層背景 */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6dd5ed 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 中央卡片容器 */
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 800px;
            padding: 40px;
        }

        /* 內容顯示區域 */
        .content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #2c3e50;
            /* 保留文字的換行與空白格式 */
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content">
<!-- 請在下方貼上你要顯示的文字 -->

馬太福音3:6。
      承認他們的罪，在約旦河裡受他的洗




       創世紀1:1。
       起初，神創造天地。
重點：神創造天地 神最大
<!-- 請在上方貼上你要顯示的文字 -->
        </div>
    </div>

</body>
</html>
